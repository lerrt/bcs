<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCS 2026</title>
</head>
<body>

<div class="countdown-container">
    <h2>BCS 2026 - Countdown to Graduation</h2>
    <div class="timer">
        <div class="time-box"><div id="days">00</div><span>Days</span></div>
        <div class="time-box"><div id="hours">00</div><span>Hours</span></div>
        <div class="time-box"><div id="minutes">00</div><span>Minutes</span></div>
        <div class="time-box"><div id="seconds">00</div><span>Seconds</span></div>
    </div>
</div>

<script>
    const targetDate = new Date("2026-09-25T10:30:00").getTime();
    const interval = setInterval(function() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days < 10 ? "0" + days : days;
        document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
        document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
        document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

        if (difference < 0) {
            clearInterval(interval);
            document.querySelector(".timer").innerHTML = "<h3>Today's the day!</h3>";
        }
    }, 1000);
</script>

</body>
</html>
